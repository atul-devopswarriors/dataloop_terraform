apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-runasuser-gte-1000
  namespace: quartz1
spec:
  validationFailureAction: Enforce
  background: true
  failurePolicy: Fail
  rules:
    - name: pods-require-runasuser-gte-1000
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Pod {{ request.object.metadata.name }}: container/initContainer
          '{{ element.name }}' has effective runAsUser
          '{{ element.securityContext.runAsUser || request.object.spec.securityContext.runAsUser || `unset` }}';
          required: >= 1000.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000

    - name: workload-templates-require-runasuser-gte-1000
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - ReplicaSet
                - ReplicationController
                - Job
      validate:
        message: >-
          {{ request.object.kind }}/{{ request.object.metadata.name }} template:
          container/initContainer '{{ element.name }}' has effective runAsUser
          '{{ element.securityContext.runAsUser || request.object.spec.template.spec.securityContext.runAsUser || `unset` }}';
          required: >= 1000.
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.template.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.template.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.template.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.template.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.template.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000

    - name: cronjob-templates-require-runasuser-gte-1000
      match:
        any:
          - resources:
              kinds:
                - CronJob
      validate:
        message: >-
          CronJob/{{ request.object.metadata.name }} template:
          container/initContainer '{{ element.name }}' has effective runAsUser
          '{{ element.securityContext.runAsUser || request.object.spec.jobTemplate.spec.template.spec.securityContext.runAsUser || `unset` }}';
          required: >= 1000.
        foreach:
          - list: "request.object.spec.jobTemplate.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.jobTemplate.spec.template.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.jobTemplate.spec.template.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.jobTemplate.spec.template.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.jobTemplate.spec.template.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.jobTemplate.spec.template.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
