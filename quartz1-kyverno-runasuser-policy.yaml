apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-runasuser-gte-1000
  namespace: quartz1
  annotations:
    pod-policies.kyverno.io/autogen-controllers: Deployment,StatefulSet,DaemonSet,ReplicaSet,ReplicationController,Job,CronJob
spec:
  validationFailureAction: Enforce
  background: false
  failurePolicy: Fail
  rules:
    - name: pod-containers-require-runasuser-gte-1000
      match:
        any:
          - resources:
              operations:
                - CREATE
                - UPDATE
              kinds:
                - Pod
      validate:
        message: >-
          Pod {{ request.object.metadata.name }} denied: every container and
          initContainer must have effective runAsUser >= 1000.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || request.object.spec.securityContext.runAsUser || `0` }}"
                    operator: LessThan
                    value: 1000
