---
- name: Deploy helm/web with Ansible Vault managed certificate files
  hosts: all
  gather_facts: false
  run_once: true
  any_errors_fatal: true

  vars:
    allowed_envs:
      - dev
      - test
      - qa

    # Override these with -e when your release/namespace naming differs.
    helm_release_name: "web-{{ env }}"
    helm_namespace: "web-{{ env }}"

    # This path matches a repository layout where this playbook lives in
    # playbooks/master-helm.yaml and the chart lives in helm/web.
    helm_chart_dir: "{{ playbook_dir }}/../helm/web"
    helm_values_file: ""

    helm_binary: helm
    helm_wait: true
    helm_atomic: true
    helm_create_namespace: true
    helm_timeout: 10m
    helm_extra_args: ""

    # These are the chart directories that contain vault-encrypted cert/key data.
    helm_vault_cert_roots:
      - "{{ helm_chart_dir }}/certs"
      - "{{ helm_chart_dir }}/multi-tenancy"

    # Required for the ansible-vault CLI commands used by this wrapper.
    vault_password_file: ""

    # Helm and ansible-vault run where the chart files exist. For the structure
    # in this repository, that is normally the Ansible controller.
    helm_delegate_to: localhost

  tasks:
    - name: Validate required deployment inputs
      ansible.builtin.assert:
        that:
          - env is defined
          - env in allowed_envs
          - helm_values_file | length > 0
          - vault_password_file | length > 0
        fail_msg: >-
          Required inputs are missing. Use:
          -e env=dev|test|qa
          -e helm_values_file=/path/to/values.yaml
          -e vault_password_file=/tmp/vault.txt
      delegate_to: "{{ helm_delegate_to }}"

    - name: Check Helm chart directory
      ansible.builtin.stat:
        path: "{{ helm_chart_dir }}"
      register: helm_chart_dir_stat
      delegate_to: "{{ helm_delegate_to }}"

    - name: Fail when Helm chart directory does not exist
      ansible.builtin.assert:
        that:
          - helm_chart_dir_stat.stat.exists
          - helm_chart_dir_stat.stat.isdir
        fail_msg: "Helm chart directory was not found: {{ helm_chart_dir }}"
      delegate_to: "{{ helm_delegate_to }}"

    - name: Check Helm values file
      ansible.builtin.stat:
        path: "{{ helm_values_file }}"
      register: helm_values_file_stat
      delegate_to: "{{ helm_delegate_to }}"

    - name: Fail when Helm values file does not exist
      ansible.builtin.assert:
        that:
          - helm_values_file_stat.stat.exists
          - helm_values_file_stat.stat.isreg
        fail_msg: "Helm values file was not found: {{ helm_values_file }}"
      delegate_to: "{{ helm_delegate_to }}"

    - name: Check configured certificate/key roots
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ helm_vault_cert_roots }}"
      register: helm_vault_cert_root_stats
      delegate_to: "{{ helm_delegate_to }}"

    - name: Find certificate/key files under existing roots
      ansible.builtin.find:
        paths: "{{ item.stat.path }}"
        recurse: true
        file_type: file
      loop: "{{ helm_vault_cert_root_stats.results | selectattr('stat.exists') | selectattr('stat.isdir') | list }}"
      register: helm_vault_cert_find_results
      delegate_to: "{{ helm_delegate_to }}"

    - name: Build list of certificate/key candidate files
      ansible.builtin.set_fact:
        helm_vault_candidate_files: >-
          {{
            helm_vault_cert_find_results.results
            | default([])
            | map(attribute='files')
            | flatten
            | map(attribute='path')
            | unique
            | sort
            | list
          }}

    - name: Detect files that are currently Ansible Vault encrypted
      ansible.builtin.shell: |
        set -euo pipefail
        first_line=""
        IFS= read -r first_line < "$TARGET_FILE" || true
        case "$first_line" in
          '$ANSIBLE_VAULT;'*) exit 0 ;;
          *) exit 1 ;;
        esac
      args:
        executable: /bin/bash
      environment:
        TARGET_FILE: "{{ item }}"
      loop: "{{ helm_vault_candidate_files }}"
      register: helm_vault_header_checks
      changed_when: false
      failed_when: helm_vault_header_checks.rc not in [0, 1]
      no_log: true
      delegate_to: "{{ helm_delegate_to }}"

    - name: Remember files that must be restored to encrypted state
      ansible.builtin.set_fact:
        helm_vault_encrypted_files: >-
          {{
            helm_vault_header_checks.results
            | default([])
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}

    - name: Deploy release with decrypted certificate/key files
      block:
        - name: Decrypt certificate/key files before Helm deploy
          ansible.builtin.command:
            argv:
              - ansible-vault
              - decrypt
              - --vault-password-file
              - "{{ vault_password_file }}"
              - "{{ item }}"
          loop: "{{ helm_vault_encrypted_files }}"
          no_log: true
          delegate_to: "{{ helm_delegate_to }}"

        - name: Run Helm upgrade/install
          ansible.builtin.command:
            argv: "{{ helm_command_argv }}"
          vars:
            helm_command_argv: >-
              {{
                [
                  helm_binary,
                  'upgrade',
                  '--install',
                  helm_release_name,
                  helm_chart_dir,
                  '--namespace',
                  helm_namespace,
                  '--values',
                  helm_values_file,
                  '--timeout',
                  helm_timeout
                ]
                + (helm_create_namespace | bool | ternary(['--create-namespace'], []))
                + (helm_wait | bool | ternary(['--wait'], []))
                + (helm_atomic | bool | ternary(['--atomic'], []))
                + (((helm_extra_args | string | length) > 0) | ternary(helm_extra_args.split(), []))
              }}
          changed_when: true
          delegate_to: "{{ helm_delegate_to }}"

      always:
        - name: Check which originally encrypted files are currently plaintext
          ansible.builtin.shell: |
            set -euo pipefail
            first_line=""
            IFS= read -r first_line < "$TARGET_FILE" || true
            case "$first_line" in
              '$ANSIBLE_VAULT;'*) exit 1 ;;
              *) exit 0 ;;
            esac
          args:
            executable: /bin/bash
          environment:
            TARGET_FILE: "{{ item }}"
          loop: "{{ helm_vault_encrypted_files | default([]) }}"
          register: helm_vault_plaintext_checks
          changed_when: false
          failed_when: helm_vault_plaintext_checks.rc not in [0, 1]
          no_log: true
          delegate_to: "{{ helm_delegate_to }}"

        - name: Build re-encryption target list
          ansible.builtin.set_fact:
            helm_vault_reencrypt_files: >-
              {{
                helm_vault_plaintext_checks.results
                | default([])
                | selectattr('rc', 'equalto', 0)
                | map(attribute='item')
                | list
              }}

        - name: Re-encrypt certificate/key files after Helm deploy
          ansible.builtin.command:
            argv:
              - ansible-vault
              - encrypt
              - --vault-password-file
              - "{{ vault_password_file }}"
              - "{{ item }}"
          loop: "{{ helm_vault_reencrypt_files }}"
          no_log: true
          delegate_to: "{{ helm_delegate_to }}"
